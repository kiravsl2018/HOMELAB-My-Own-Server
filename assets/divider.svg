<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 14" width="1000" height="14" role="presentation">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E95420" stop-opacity="0"/>
      <stop offset=".3" stop-color="#E95420"/>
      <stop offset=".7" stop-color="#77216F"/>
      <stop offset="1" stop-color="#77216F" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6" width="1000" height="2" rx="1" fill="url(#l)"/>
  <circle cy="7" r="4" fill="#ff8a5c">
    <animate attributeName="cx" values="0;1000" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="5s" repeatCount="indefinite"/>
