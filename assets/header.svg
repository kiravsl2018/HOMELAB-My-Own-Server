  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset=".55" stop-color="#1c0a1f"/><stop offset="1" stop-color="#2C001E"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a5c"/><stop offset=".5" stop-color="#E95420"/><stop offset="1" stop-color="#c05bd0"/>
      <animate attributeName="x1" values="0;.5;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.5;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="brd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E95420"/><stop offset="1" stop-color="#77216F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E95420" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="2" y="2" width="996" height="296" rx="20"/></clipPath>
  </defs>
